# ==============================================================================
# ⚡ KYVON Autonomous CI/CD Pipeline Configuration
# Ecosystem: Reiwa Sakura Tech (gitlab.reiwasakura.tech)
# Gatekeeper Engine: https://ctoai.reiwasakura.tech/api/ci/gatekeeper
# ==============================================================================

stages:
  - lint
  - kyvon_audit
  - build
  - test
  - deploy

variables:
  KYVON_GATEKEEPER_URL: "https://ctoai.reiwasakura.tech/api/ci/gatekeeper"
  KYVON_API_KEY: "$CI_KYVON_API_KEY"
  PNPM_HOME: "/root/.local/share/pnpm"

# ------------------------------------------------------------------------------
# Stage 1: Syntax & Code Linting
# ------------------------------------------------------------------------------
lint:python:
  stage: lint
  image: python:3.11-slim
  script:
    - python -m py_compile kyvon-cto-engine/bot/main.py
    - python -m py_compile kyvon-cto-engine/bot/evaluator.py
    - python -m py_compile kyvon-cto-engine/kyvontrain.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

lint:typescript:
  stage: lint
  image: node:20-slim
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
  script:
    - cd kyvon-care-ui
    - pnpm install --frozen-lockfile || pnpm install
    - pnpm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ------------------------------------------------------------------------------
# Stage 2: KYVON 50-Condition Gatekeeper & O(N^2) Regression Check
# ------------------------------------------------------------------------------
kyvon_audit_gate:
  stage: kyvon_audit
  image: alpine:latest
  before_script:
    - apk add --no-cache curl git jq
  script:
    - echo "⚡ Invoking KYVON 50-Condition Gatekeeper on ctoai.reiwasakura.tech..."
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        DIFF_PAYLOAD=$(git diff "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" HEAD)
      else
        DIFF_PAYLOAD=$(git diff HEAD~1 HEAD || echo "Initial commit")
      fi
    - |
      ESCAPED_DIFF=$(echo "$DIFF_PAYLOAD" | jq -Rs .)
      RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$KYVON_GATEKEEPER_URL" \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer $KYVON_API_KEY" \
        -d "{\"project_id\": \"$CI_PROJECT_ID\", \"commit_sha\": \"$CI_COMMIT_SHA\", \"diff\": $ESCAPED_DIFF}")
      
      HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
      HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
      
      echo "KYVON Gatekeeper Response (HTTP $HTTP_STATUS):"
      echo "$HTTP_BODY"
      
      if [ "$HTTP_STATUS" != "200" ]; then
        echo "❌ KYVON Audit Gate Failed or Service Unreachable (HTTP $HTTP_STATUS)"
        exit 1
      fi
      
      VERDICT=$(echo "$HTTP_BODY" | jq -r '.verdict // "APPROVE"')
      if [ "$VERDICT" = "REJECT" ]; then
        echo "❌ KYVON Rejected PR: High-severity architectural or complexity violation detected."
        exit 1
      fi
      
      echo "✔ KYVON Gatekeeper Approved ($VERDICT)"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ------------------------------------------------------------------------------
# Stage 3: Build Artifacts
# ------------------------------------------------------------------------------
build:care_ui:
  stage: build
  image: node:20-slim
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
  script:
    - cd kyvon-care-ui
    - pnpm install
    - pnpm run build
  artifacts:
    name: "kyvon-care-ui-dist-$CI_COMMIT_SHORT_SHA"
    paths:
      - kyvon-care-ui/dist/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ------------------------------------------------------------------------------
# Stage 4: Automated Testing
# ------------------------------------------------------------------------------
test:python:
  stage: test
  image: python:3.11-slim
  script:
    - python -m unittest discover -s kyvon-cto-engine/tests -p "*.py"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

test:chat:
  stage: test
  image: node:22-slim
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
  script:
    - cd chat
    - pnpm install
    - pnpm typecheck
    - pnpm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

test:meet:
  stage: test
  image: node:22-slim
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
  script:
    - cd meet
    - pnpm install
    - pnpm typecheck
    - pnpm test
    - pnpm build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

test:care_ui:
  stage: test
  image: node:22-slim
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
  script:
    - cd kyvon-care-ui
    - pnpm install
    - pnpm test
    - pnpm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

