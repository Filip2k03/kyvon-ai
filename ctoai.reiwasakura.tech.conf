limit_req_zone $binary_remote_addr zone=kyvon_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ctoai.reiwasakura.tech;

    location /.well-known/acme-challenge/ {
        root /opt/kyvon-cto-engine/certbot/www;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ctoai.reiwasakura.tech;

    ssl_certificate /etc/letsencrypt/live/ctoai.reiwasakura.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctoai.reiwasakura.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Custom MIME Types
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
        application/javascript js mjs;
        text/css css;
    }

    proxy_read_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;

    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    # Static Web Client (KYVON Care & Chat UI)
    location ^~ /care {
        root /opt/kyvon-care-ui/dist;
        try_files $uri $uri/ /care/index.html =404;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    location ^~ /chat {
        root /opt/kyvon-care-ui/dist;
        try_files $uri $uri/ /chat/index.html =404;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    location ^~ /assets/ {
        root /opt/kyvon-care-ui/dist;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        limit_req zone=kyvon_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
