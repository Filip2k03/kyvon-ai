name: KYVON 0xPlus Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Python Engine Bytecode, AST & Unit Tests
  # ----------------------------------------------------------------------------
  python-test:
    name: 🐍 Python CTO Engine & AI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "kyvon-cto-engine/bot/requirements.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r kyvon-cto-engine/bot/requirements.txt pytest

      - name: Verify Bytecode Compilation
        run: |
          python -m py_compile kyvon-cto-engine/bot/main.py
          python -m py_compile kyvon-cto-engine/bot/evaluator.py
          python -m py_compile kyvon-cto-engine/kyvontrain.py

      - name: Run Python Unit & Integrity Tests
        run: |
          pytest kyvon-cto-engine/tests/ -v

  # ----------------------------------------------------------------------------
  # Job 2: Care UI Lit-HTML & TypeScript PWA Verification
  # ----------------------------------------------------------------------------
  care-ui-test:
    name: 📱 KYVON Care Studio PWA Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "kyvon-care-ui/pnpm-lock.yaml"

      - name: Install Dependencies
        working-directory: kyvon-care-ui
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        working-directory: kyvon-care-ui
        run: pnpm test

      - name: Bundle Production Build
        working-directory: kyvon-care-ui
        run: pnpm run build

  # ----------------------------------------------------------------------------
  # Job 3: Go RAG & BM25 Vector Search Compilation
  # ----------------------------------------------------------------------------
  go-rag-test:
    name: ⚡ Go RAG Engine Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: "kyvon-cto-engine/rag/go.mod"

      - name: Build Go RAG Engine
        working-directory: kyvon-cto-engine/rag
        run: |
          go build -ldflags="-s -w" -o kyvon-rag engine.go
          ./kyvon-rag -q "attention mechanism" -k 1
