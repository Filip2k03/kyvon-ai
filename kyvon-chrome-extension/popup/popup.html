<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYVON Quick Audit</title>
  <style>
    :root {
      --bg: #F5F8FA;
      --card-bg: #FFFFFF;
      --text: #1A2732;
      --text-muted: #648FA8;
      --primary: #0284C7;
      --primary-hover: #0369A1;
      --border: #D6E2EB;
      --emerald: #10B981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      width: 360px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      overflow-x: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #38586D, #0284C7);
      color: white;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
    }
    .title { font-size: 13px; font-weight: 700; }
    .status {
      font-size: 10px;
      padding: 2px 6px;
      background: #ECFDF5;
      color: #047857;
      border: 1px solid #A7F3D0;
      border-radius: 12px;
      font-weight: 600;
    }
    textarea {
      width: 100%;
      height: 90px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      color: var(--text);
      resize: none;
      outline: none;
      margin-bottom: 10px;
    }
    textarea:focus { border-color: var(--primary); }
    .btn-group { display: flex; gap: 8px; }
    button {
      flex: 1;
      height: 38px;
      border-radius: 10px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #273C4B, #1A2732);
      color: white;
    }
    .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-secondary {
      background: #EBF1F5;
      color: #38586D;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #D6E2EB; }
    .footer {
      margin-top: 12px;
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="badge-icon">K</div>
      <div class="title">KYVON 0xPlus</div>
    </div>
    <div class="status">● ctoai Online</div>
  </header>

  <textarea id="prompt-input" placeholder="Paste code snippet or query for 50-condition audit..."></textarea>

  <div class="btn-group">
    <button id="btn-sidepanel" class="btn-secondary">
      <span>🚀 Side Panel</span>
    </button>
    <button id="btn-audit" class="btn-primary">
      <span>⚡ Audit Code</span>
    </button>
  </div>

  <div class="footer">ctoai.reiwasakura.tech // vLLM-2.5</div>

  <script src="popup.js"></script>
</body>
</html>
