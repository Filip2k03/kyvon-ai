<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYVON 0xPlus Side Panel</title>
  <script src="../vendor/marked.min.js"></script>
  <style>
    :root {
      --bg: #F5F8FA;
      --card-bg: #FFFFFF;
      --text: #1A2732;
      --text-muted: #648FA8;
      --primary: #0284C7;
      --border: #D6E2EB;
      --accent: #10B981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      width: 100%;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      height: 52px;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; }
    .badge-icon {
      width: 26px; height: 26px;
      background: linear-gradient(135deg, #38586D, #0284C7);
      color: white; border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: bold;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    #chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      word-break: break-word;
    }
    .message.user { align-items: flex-end; margin-left: 24px; }
    .message.ai { align-items: flex-start; margin-right: 12px; }
    .msg-meta { font-size: 10px; color: var(--text-muted); font-family: monospace; }
    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.5;
      border: 1px solid var(--border);
      max-width: 100%;
      overflow-x: auto;
    }
    .message.user .bubble {
      background: #1A2732;
      color: white;
      border-color: transparent;
      border-top-right-radius: 4px;
    }
    .message.ai .bubble {
      background: var(--card-bg);
      color: var(--text);
      border-top-left-radius: 4px;
      box-shadow: 0 4px 20px rgba(100, 143, 168, 0.08);
    }
    .bubble pre {
      background: #0F172A;
      color: #E2E8F0;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 11px;
    }
    .bubble code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    .bubble p { margin-bottom: 6px; }
    .bubble p:last-child { margin-bottom: 0; }
    footer {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .quick-actions { display: flex; gap: 6px; }
    .chip {
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 6px;
      background: #EBF1F5;
      color: #38586D;
      border: 1px solid var(--border);
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s;
    }
    .chip:hover { background: #D6E2EB; }
    .input-bar { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      height: 40px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 12px;
      font-size: 12px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--primary); }
    .send-btn {
      height: 40px;
      padding: 0 16px;
      border-radius: 10px;
      border: none;
      background: #1A2732;
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .send-btn:hover { background: #273C4B; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="badge-icon">K</div>
      <span>KYVON Side Panel</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #047857;">
      <span class="status-dot"></span>
      <span>ctoai Active</span>
    </div>
  </header>

  <div id="chat-stream">
    <div class="message ai">
      <div class="msg-meta">KYVON CORE • CONNECTED</div>
      <div class="bubble">
        ⚡ <strong>KYVON 0xPlus Side Panel Ready</strong>. Highlight any code or text on the page, or click <em>Inspect Tab</em> below to analyze architecture and invariants.
      </div>
    </div>
  </div>

  <footer>
    <div class="quick-actions">
      <button id="chip-inspect" class="chip">🔍 Inspect Page Context</button>
      <button id="chip-audit" class="chip">⚡ 50-Condition Audit</button>
      <button id="chip-clear" class="chip">🧹 Clear</button>
    </div>
    <div class="input-bar">
      <input type="text" id="side-input" placeholder="Ask KYVON..." />
      <button id="side-send" class="send-btn">Send</button>
    </div>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
