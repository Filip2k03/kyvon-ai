# =============================================================================
# Nginx Configuration for KYVON CTO Engine & vLLM Endpoints
# Domains:
#   - kyvon.reiwasakura.tech (vLLM OpenAI Endpoint -> Port 8000)
#   - ctoai.reiwasakura.tech (KYVON CTO Bot & Webhook Service -> Port 8090)
# =============================================================================

# 1. vLLM Direct API Endpoint (kyvon.reiwasakura.tech)
server {
    listen 80;
    server_name kyvon.reiwasakura.tech;
    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming and Long LLM Generation Timeouts
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}

# 2. KYVON CTO Bot & GitLab Webhook Hub (ctoai.reiwasakura.tech)
server {
    listen 80;
    server_name ctoai.reiwasakura.tech;
    client_max_body_size 128M;

    # GitLab Webhooks and Bot Controller
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support streaming LLM token generation
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
