# Merge with the existing private /home/sakuraCTO/mail/docker-compose.yml.
# This file contains no credentials and is not a standalone mail stack.
services:
  mailserver:
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: 5
