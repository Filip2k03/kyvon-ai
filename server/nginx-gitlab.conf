# GitLab Omnibus — host nginx vhost ONLY.
# Do not put reiwasakura.tech / www / auth / admin / career / docs here.
# Those belong to sites-available/reiwasakura-app.
#
# Upstream: GitLab Omnibus on 127.0.0.1:6969
# If you paste this as its own sites-available file, do not also keep a
# gitlab.reiwasakura.tech server{} inside sakura (duplicate server_name).

server {
    listen 80;
    listen [::]:80;
    server_name gitlab.reiwasakura.tech;
    client_max_body_size 500M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:6969;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
